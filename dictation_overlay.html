<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Vlocal : pilule de dictée, en bas de l'écran (overlay.py, NSPanel fixe de
   360 x 132 px, clics traversants).

   Le VERRE est natif : overlay.py pose sous cette page un NSGlassEffectView
   (macOS 26), un NSVisualEffectView, ou une forme opaque si « Réduire la
   transparence » est actif. Une page web transparente ne voit pas les fenêtres
   derrière elle, backdrop-filter n'y floute rien. La page ne dessine donc que le
   contenu (la bulle, l'onde, les textes) et calcule la forme voulue pour chaque
   état ; elle l'envoie à overlay.py (canal « vlocal ») qui anime le verre avec
   la même durée et la même courbe que ces transitions (GLASS_MS, GLASS_CURVE).
   Sans verre natif (aperçu dans un navigateur), .shape le remplace en CSS.

   La bulle, symbole de la marque, est le cœur de la pilule : seule au repos, à
   gauche de l'onde pendant l'écoute, un reflet qui tourne pendant la
   transcription, une coche au résultat. Page autonome : police système, SVG en
   ligne, aucun accès réseau ni fichier. Jetons de marque recopiés de
   assets/brand.css (égalité vérifiée par tests/test_brand_tokens.py). */
:root{
  --vl-night:#11141F;
  --vl-night-rgb:17,20,31;
  --vl-white:#FFFFFF;
  --vl-accent:#AEB8FF;
  --vl-accent-rgb:174,184,255;
  --vl-accent-deep:#5C68DE;
  --vl-accent-deep-rgb:92,104,222;
}
:root{
  /* Sombre (défaut) : verre teinté nuit, encre blanche. */
  --ink:var(--vl-white);
  --ink-2:rgba(255,255,255,.80);
  --accent:var(--vl-accent);
  --alert:#FF6961;
  --sim-fill:rgba(var(--vl-night-rgb),.80);
  --sim-edge:rgba(255,255,255,.16);
  --sim-light:rgba(255,255,255,.30);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  /* Ressort amorti sans rebond (rien ne sautille), 260 ms : la même courbe
     anime le verre natif (overlay.GLASS_CURVE, GLASS_MS). */
  --curve:cubic-bezier(.2,.9,.25,1);
  --t:260ms;
  --t-fade:120ms;    /* sortie franche, puis entrée : jamais deux contenus superposés */
  --w:36px;--h:22px;--r:11px;
}
html[data-theme="light"]{
  /* Clair : verre teinté blanc, encre bleu nuit. */
  --ink:var(--vl-night);
  --ink-2:rgba(var(--vl-night-rgb),.72);
  --accent:var(--vl-accent-deep);
  --alert:#D70015;
  --sim-fill:rgba(255,255,255,.82);
  --sim-edge:rgba(var(--vl-night-rgb),.10);
  --sim-light:rgba(255,255,255,.85);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);
  -webkit-user-select:none;user-select:none;cursor:default}

/* ---- Cadre commun : la forme (simulée) et le contenu partagent la même boîte ---- */
.shape,.box{position:absolute;left:50%;bottom:14px;width:var(--w);height:var(--h);
  transform:translateX(-50%);border-radius:var(--r);
  transition:width var(--t) var(--curve),height var(--t) var(--curve),border-radius var(--t) var(--curve)}
.shape{background:var(--sim-fill);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--sim-light),inset 0 0 0 .5px var(--sim-edge),
             0 12px 30px -12px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.16)}
html[data-glass="native"] .shape{display:none}
/* Le contenu ne déborde jamais de la forme pendant qu'elle grandit. */
.box{overflow:hidden}

/* ---- La bulle ---- */
.mark{position:absolute;left:var(--mx,9.5px);top:var(--my,3.8px);width:17px;height:14.4px;color:var(--ink);
  transform:scale(var(--ms,.7));transform-origin:50% 50%;
  transition:left var(--t) var(--curve),top var(--t) var(--curve),transform var(--t) var(--curve),color var(--t-fade) ease}
.mark svg{display:block;width:100%;height:100%;overflow:visible;shape-rendering:geometricPrecision}
.mark .bub{transition:opacity var(--t-fade) ease,transform var(--t) var(--curve);transform-origin:57.7% 50%}
.mark .sheen{opacity:0;transform-origin:78.57px 57.72px}
.mark .tick{fill:none;stroke:var(--accent);stroke-width:15;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:120;stroke-dashoffset:120;opacity:0}
body[data-locked="1"] .mark,body[data-state="tooshort"] .mark,body[data-state="mic"] .mark,
body[data-state="info"] .mark{color:var(--accent)}
body[data-state="error"] .mark{color:var(--alert)}
/* Transcription : le corps de la bulle s'efface à moitié, un reflet en fait le tour. */
body[data-state="transcribing"] .mark .base{opacity:.42}
body[data-state="transcribing"] .mark .sheen{opacity:1;animation:sweep 1.4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
/* Résultat : la bulle se résorbe, la coche se trace à sa place. */
body[data-state="result"] .mark .bub{opacity:0;transform:scale(.6)}
body[data-state="result"] .mark .tick{opacity:1;stroke-dashoffset:0;
  transition:stroke-dashoffset 280ms var(--curve) 80ms,opacity 1ms linear 80ms}

/* ---- Onde : barres mises à l'échelle (scaleY), composées sans relayout ---- */
.wave{position:absolute;left:41px;top:9px;display:flex;align-items:center;gap:3px;height:18px;
  opacity:0;transition:opacity var(--t-fade) ease}
.wb{width:3px;height:18px;border-radius:1.5px;background:var(--ink);transform:scaleY(.12)}
body[data-state="recording"] .wave{opacity:1;transition-delay:var(--t-fade)}

/* ---- Libellé dans la pilule (mains libres, attente, résultat) ---- */
.label{position:absolute;top:0;height:36px;line-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:13px;font-weight:600;letter-spacing:-.01em;opacity:0;transition:opacity var(--t-fade) ease}
.label.on{opacity:1;transition-delay:var(--t-fade)}

/* ---- Carte (trop court, erreur, micro, information) ---- */
.ctext{position:absolute;left:41px;top:12px;width:max-content;max-width:263px;
  opacity:0;transition:opacity var(--t-fade) ease}
body.card-on .ctext{opacity:1;transition-delay:var(--t-fade)}
.ctitle{font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.01em}
.csub{margin-top:2px;font-size:12px;line-height:16px;color:var(--ink-2)}
.ctitle,.csub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub:empty{display:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  :root{--t:0ms;--t-fade:0ms}
  body[data-state="transcribing"] .mark .sheen{animation:none;opacity:0}
  body[data-state="transcribing"] .mark .base{opacity:.8}
  body[data-state="result"] .mark .tick{transition:none}
}
</style>
</head>
<body data-state="idle">
  <div class="shape" aria-hidden="true"></div>
  <div class="box" aria-hidden="true">
    <div class="mark" id="mark"><svg viewBox="0 0 136.29 115.44">
      <defs>
        <!-- Tracé de assets/vlocal-symbol.svg (identité vérifiée par test). -->
        <path id="bubble" fill-rule="evenodd" d="M78.57 115.44C110.45 115.44 136.29 89.6 136.29 57.72C136.29 25.84 110.45 0 78.57 0C46.69 0 20.85 25.84 20.85 57.72L20.85 70.76C20.85 92.96 9.6 113.19 0 115.44ZM108.8 58.01C108.8 76.54 95.19 91.56 78.41 91.56C61.63 91.56 48.02 76.54 48.02 58.01C48.02 39.48 61.63 24.46 78.41 24.46C95.19 24.46 108.8 39.48 108.8 58.01Z"/>
        <clipPath id="bubble-clip"><use href="#bubble"/></clipPath>
        <linearGradient id="sheen-band" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="currentColor" stop-opacity="0"/>
          <stop offset=".5" stop-color="currentColor" stop-opacity="1"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="bub">
        <use class="base" href="#bubble" fill="currentColor"/>
        <g clip-path="url(#bubble-clip)"><rect class="sheen" x="58.57" y="-30" width="40" height="88" fill="url(#sheen-band)"/></g>
      </g>
      <path class="tick" d="M38 60 L64 86 L106 30"/>
    </svg></div>
    <div class="wave" id="wave"></div>
    <div class="label" id="label"></div>
    <div class="ctext" id="ctext"><div class="ctitle" id="ctitle"></div><div class="csub" id="csub"></div></div>
  </div>
  <div class="sr" id="status" role="status"></div>

<script>
(function(){
  "use strict";
  var body = document.body, root = document.documentElement;
  var mark = document.getElementById('mark'), label = document.getElementById('label');
  var ctext = document.getElementById('ctext');
  var ctitle = document.getElementById('ctitle'), csub = document.getElementById('csub');
  var status = document.getElementById('status');
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---- Textes (fr/en), langue poussée par overlay.py via ovLang() ----
  var OV = {
    fr:{ listen:'Écoute', work:'Transcription', wait:'Encore un instant…', inserted:'Texte inséré', copied:'Texte copié',
         tooshort:'C’est un peu court.', tooshort_sub:'Maintenez le raccourci un peu plus longtemps.',
         error:'Une erreur est survenue.', retry_hk:'Réessayez : maintenez {0}', retry:'Réessayez quand vous voulez.',
         mic:'Micro requis.', mic_sub:'Autorisez le microphone dans Réglages.',
         mic_open:'Micro ouvert', locked:'{0} pour terminer', locked_nohk:'Rappuyez pour terminer',
         tap_sub:'Appuyez deux fois pour garder le micro ouvert.' },
    en:{ listen:'Listening', work:'Transcribing', wait:'One more moment…', inserted:'Text inserted', copied:'Text copied',
         tooshort:'That was a bit short.', tooshort_sub:'Hold the shortcut a little longer.',
         error:'Something went wrong.', retry_hk:'Try again: hold {0}', retry:'Try again whenever you like.',
         mic:'Microphone needed.', mic_sub:'Allow the microphone in Settings.',
         mic_open:'Mic open', locked:'{0} to finish', locked_nohk:'Press again to finish',
         tap_sub:'Double-tap to keep the mic open.' }
  };
  var lang = 'fr', hotkey = null;
  function tt(k, a){
    var s = (OV[lang] || OV.fr)[k];
    if(s === undefined) s = OV.fr[k];
    if(s === undefined) return k;
    return a === undefined ? s : String(s).split('{0}').join(a);
  }

  // ---- Géométrie : source unique de la forme de chaque état ----------------
  // Tailles en px CSS, paires pour que le centrage dans le panneau (360 px)
  // tombe sur des pixels entiers. La bulle mesure 17 x 14,4 px.
  var GEOM = {"idle": {"w": 36, "h": 22, "r": 11},
              "pill": {"h": 36, "r": 18, "pad": 12, "gap": 10, "wave": 93, "solo": 56},
              "card": {"r": 18, "pad": 14, "gap": 10, "min": 220, "max": 320, "vpad": 12}};
  var MARK_W = 17, MARK_H = 14.4;
  var MAX_W = 340;          // panneau de 360 px moins l'ombre
  function even(v){ return 2 * Math.ceil(v / 2); }
  function half(v){ return Math.round(v * 2) / 2; }   // demi-pixel CSS = pixel entier en @2x

  function geometry(state){
    var p = GEOM.pill, c = GEOM.card, lab = label.textContent ? label.offsetWidth : 0;
    if(state === 'idle') return {w: GEOM.idle.w, h: GEOM.idle.h, r: GEOM.idle.r};
    if(state === 'recording'){
      var w = p.pad + MARK_W + p.gap + p.wave + p.pad + 2;
      if(lab) w += p.gap + 4 + lab;
      return {w: even(w), h: p.h, r: p.r};
    }
    if(state === 'transcribing' && !lab) return {w: p.solo, h: p.h, r: p.r};
    if(state === 'transcribing' || state === 'result')
      return {w: even(p.pad + MARK_W + p.gap + lab + p.pad + 2), h: p.h, r: p.r};
    var tw = ctext.offsetWidth, th = ctext.offsetHeight;          // carte
    var cw = Math.max(c.min, Math.min(c.max, c.pad + MARK_W + c.gap + tw + c.pad + 2));
    return {w: even(cw), h: even(th + 2 * c.vpad), r: c.r};
  }

  // Place le contenu dans la forme et prévient le verre natif.
  function shape(state){
    var p = GEOM.pill, c = GEOM.card;
    // Le libellé ne peut pas pousser la pilule hors du panneau : il s'abrège.
    var lx = p.pad + 2 + MARK_W + p.gap + (state === 'recording' ? p.wave + p.gap + 4 : 0);
    label.style.left = lx + 'px';
    label.style.maxWidth = (MAX_W - lx - p.pad - 2) + 'px';
    var g = geometry(state);
    var mx, my, ms = 1;
    if(state === 'idle'){ mx = (g.w - MARK_W) / 2; my = (g.h - MARK_H) / 2; ms = .7; }
    else if(state === 'transcribing' && !label.textContent){ mx = (g.w - MARK_W) / 2; my = (g.h - MARK_H) / 2; }
    else if(body.classList.contains('card-on')){ mx = c.pad; my = c.vpad + 2; }
    else { mx = p.pad + 2; my = (g.h - MARK_H) / 2; }
    root.style.setProperty('--w', g.w + 'px');
    root.style.setProperty('--h', g.h + 'px');
    root.style.setProperty('--r', g.r + 'px');
    mark.style.setProperty('--mx', half(mx) + 'px');
    mark.style.setProperty('--my', half(my) + 'px');
    mark.style.setProperty('--ms', String(ms));
    var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.vlocal;
    if(h) h.postMessage({state: state, w: g.w, h: g.h, r: g.r});
    return g;
  }

  // ---- Onde ----------------------------------------------------------------
  // Le niveau arrive à 10 Hz (ovLevel). La boucle d'images ne tourne QUE pendant
  // l'écoute : elle rapproche en douceur le niveau affiché du dernier niveau reçu
  // (filtre du premier ordre, indépendant de la cadence d'affichage), puis le
  // laisse retomber si plus rien n'arrive. Hors écoute, aucune image n'est
  // demandée : au repos l'overlay ne consomme rien.
  var N = 16, bars = [], env = [], phase = [];
  (function(){
    var w = document.getElementById('wave');
    for(var i = 0; i < N; i++){
      var b = document.createElement('span'); b.className = 'wb'; w.appendChild(b); bars.push(b);
      env.push(0.35 + 0.65 * Math.sin(Math.PI * (i + 0.5) / N));   // plus haut au centre
      phase.push((i * 1.7) % 6.283);
    }
  })();
  var target = 0, shown = 0, lastLevelAt = 0, lastFrameAt = 0, raf = 0;
  var TAU_MS = 90;          // temps de réponse du lissage
  var HOLD_MS = 250;        // sans nouveau niveau au-delà, la cible retombe
  var DECAY_MS = 180;       // vitesse de cette retombée

  function now(){ return window.performance ? performance.now() : Date.now(); }
  function paint(level, t){
    for(var i = 0; i < N; i++){
      // Vie propre à chaque barre, proportionnelle au niveau : calme en silence.
      var life = reduced ? 1 : 0.72 + 0.28 * Math.sin(phase[i] + t * 0.011);
      var s = 0.12 + 0.88 * env[i] * level * life;
      bars[i].style.transform = 'scaleY(' + s.toFixed(3) + ')';
    }
  }
  function frame(t){
    raf = 0;
    if(body.getAttribute('data-state') !== 'recording') return;
    var dt = lastFrameAt ? Math.min(100, t - lastFrameAt) : 16;
    lastFrameAt = t;
    if(t - lastLevelAt > HOLD_MS) target *= Math.exp(-dt / DECAY_MS);
    shown += (target - shown) * (1 - Math.exp(-dt / TAU_MS));
    paint(shown, t);
    raf = window.requestAnimationFrame(frame);
  }
  function startWave(){
    target = shown = 0; lastFrameAt = 0;
    paint(0, 0);
    if(!reduced && !raf) raf = window.requestAnimationFrame(frame);
  }
  function stopWave(){
    if(raf){ window.cancelAnimationFrame(raf); raf = 0; }
  }

  // ---- États ----------------------------------------------------------------
  var waitTimer = 0;
  function clearWait(){ if(waitTimer){ clearTimeout(waitTimer); waitTimer = 0; } }
  function setLabel(text){
    label.textContent = text || '';
    if(text) label.classList.add('on'); else label.classList.remove('on');
  }
  function setState(s, text){
    clearWait();
    body.setAttribute('data-state', s);
    if(s !== 'recording'){ stopWave(); body.removeAttribute('data-locked'); }
    body.classList.remove('card-on');
    setLabel(text);
  }
  function showCard(state, title, sub){
    setState(state);
    ctitle.textContent = title || '';
    csub.textContent = sub || '';
    body.classList.add('card-on');
    status.textContent = (title || '') + (sub ? ' ' + sub : '');
    shape(state);
  }

  // ---- API pilotée par overlay.py (noms et signatures figés) ----------------
  window.ovLang = function(l){ if(l === 'fr' || l === 'en'){ lang = l; root.setAttribute('lang', l); } };
  window.ovTheme = function(th){ root.setAttribute('data-theme', th === 'light' ? 'light' : 'dark'); };
  window.ovHotkey = function(label){ hotkey = label || null; };
  // Le verre natif est en place : la forme simulée s'efface.
  window.ovGlass = function(kind){ root.setAttribute('data-glass', kind === 'native' ? 'native' : 'css'); };

  window.ovRecording = function(){
    setState('recording');
    status.textContent = tt('listen');
    shape('recording');
    startWave();
  };
  window.ovLevel = function(v){
    v = parseFloat(v);
    if(isNaN(v)) return;
    target = Math.max(0, Math.min(1, v * 4.2));   // RMS de parole ~0,02 à 0,25 -> 0..1
    lastLevelAt = now();
    if(reduced && body.getAttribute('data-state') === 'recording') paint(target, 0);
  };
  window.ovLocked = function(lbl){
    body.setAttribute('data-locked', '1');
    setLabel(lbl ? tt('locked', lbl) : tt('locked_nohk'));
    status.textContent = tt('mic_open') + ' · ' + label.textContent;
    shape('recording');
  };
  window.ovTranscribing = function(rec_s){
    setState('transcribing');
    status.textContent = tt('work');
    shape('transcribing');
    // Rassure si c'est anormalement long (avant le chien de garde de app.py).
    waitTimer = setTimeout(function(){ waitTimer = 0; setLabel(tt('wait')); shape('transcribing'); }, 8000);
  };
  window.ovResult = function(trans_s, inserted, branch, text){
    setState('result', inserted ? tt('inserted') : tt('copied'));
    status.textContent = label.textContent;
    shape('result');
  };
  window.ovTooShort = function(){ showCard('tooshort', tt('tooshort'), tt('tooshort_sub')); };
  window.ovTooShortTap = function(){ showCard('tooshort', tt('tooshort'), tt('tap_sub')); };
  window.ovError = function(msg){
    showCard('error', msg || tt('error'), hotkey ? tt('retry_hk', hotkey) : tt('retry'));
  };
  window.ovMicNeeded = function(){ showCard('mic', tt('mic'), tt('mic_sub')); };
  window.ovInfo = function(title, sub){ showCard('info', title, sub); };
  // Fin d'affichage : la pilule se replie au repos (c'est l'animation de sortie).
  window.ovFadeOut = function(){ setState('idle'); shape('idle'); };
  window.ovReset = function(){ setState('idle'); status.textContent = ''; shape('idle'); };
})();
</script>
</body>
</html>
