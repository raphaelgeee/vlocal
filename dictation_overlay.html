<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Vlocal : pilule de dictée, en bas de l'écran (overlay.py, NSPanel fixe de
   PANEL_W x PANEL_H px, clics traversants).

   - Au repos, une petite pilule discrète, sans aucune animation en cours.
   - À l'appui, elle s'étend en ressort (transition CSS, le panneau ne bouge pas)
     et montre une onde qui suit la voix ; puis la transcription, le résultat
     bref, ou une carte compacte pour les messages.
   - Page autonome : police système, icônes en SVG en ligne, aucun accès réseau
     ni fichier. Les jetons de marque sont recopiés de assets/brand.css
     (égalité vérifiée par tests/test_brand_tokens.py). */
:root{
  --vl-night:#11141F;
  --vl-night-rgb:17,20,31;
  --vl-white:#FFFFFF;
  --vl-accent:#AEB8FF;
  --vl-accent-rgb:174,184,255;
  --vl-accent-deep:#5C68DE;
  --vl-accent-deep-rgb:92,104,222;
}
:root{
  /* Thème sombre (défaut) : verre bleu nuit, encre blanche. */
  --surface:rgba(var(--vl-night-rgb),.94);
  --edge:rgba(255,255,255,.14);
  --ink:var(--vl-white);
  --ink-2:rgba(255,255,255,.74);       /* 10:1 sur la surface */
  --rest:rgba(var(--vl-night-rgb),.42);
  --rest-edge:rgba(255,255,255,.30);
  --accent:var(--vl-accent);
  --alert:#FF6961;
  --shadow:0 10px 28px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.22);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  /* Ressort : léger dépassement, sous 250 ms. */
  --spring:cubic-bezier(.34,1.45,.55,1);
  --t-grow:240ms;
  --t-fade:160ms;
}
html[data-theme="light"]{
  /* Thème clair : verre blanc, encre bleu nuit. */
  --surface:rgba(255,255,255,.96);
  --edge:rgba(var(--vl-night-rgb),.12);
  --ink:var(--vl-night);
  --ink-2:rgba(var(--vl-night-rgb),.70);   /* 5,6:1 sur blanc */
  --rest:rgba(255,255,255,.55);
  --rest-edge:rgba(var(--vl-night-rgb),.22);
  --accent:var(--vl-accent-deep);
  --alert:#D70015;
  --shadow:0 10px 26px -12px rgba(var(--vl-night-rgb),.30),0 1px 4px rgba(var(--vl-night-rgb),.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink);
  -webkit-user-select:none;user-select:none;cursor:default}

/* ---- La pilule : un seul élément qui change de taille selon l'état ---- */
.pill{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  width:40px;height:8px;border-radius:999px;
  background:var(--rest);box-shadow:inset 0 0 0 .5px var(--rest-edge);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:width var(--t-grow) var(--spring),height var(--t-grow) var(--spring),
             background-color var(--t-fade) ease,box-shadow var(--t-fade) ease,opacity var(--t-fade) ease}
body:not([data-state="idle"]) .pill{background:var(--surface);
  box-shadow:inset 0 0 0 .5px var(--edge),var(--shadow)}
body[data-state="recording"] .pill{width:136px;height:34px}
body[data-locked="1"][data-state="recording"] .pill{width:156px}   /* place du point */
body[data-state="transcribing"] .pill{width:76px;height:34px}
body[data-state="result"] .pill{width:148px;height:34px}
/* Messages : la pilule se replie, la carte prend la place. */
body.card-on .pill{width:40px;height:8px;opacity:0}

.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:7px;opacity:0;transition:opacity var(--t-fade) ease}
body[data-state="recording"] .l-wave,
body[data-state="transcribing"] .l-work,
body[data-state="result"] .l-done{opacity:1;transition-delay:60ms}

/* Onde : barres mises à l'échelle (scaleY), donc composées sans relayout. */
.wave{display:flex;align-items:center;gap:3px;height:20px}
.wb{width:3px;height:20px;border-radius:2px;background:var(--ink);
  transform:scaleY(.12);transform-origin:center}

/* Transcription : trois points qui respirent (uniquement dans cet état). */
.dot{width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.35}
body[data-state="transcribing"] .dot{animation:breathe 1.05s ease-in-out infinite}
body[data-state="transcribing"] .dot:nth-child(2){animation-delay:.15s}
body[data-state="transcribing"] .dot:nth-child(3){animation-delay:.3s}
@keyframes breathe{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

.l-done{font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.l-done svg{flex:none;color:var(--accent)}

/* Mains libres : point d'accent dans la pilule, consigne au-dessus. */
.lockdot{position:absolute;left:12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;
  background:var(--accent);opacity:0;transition:opacity var(--t-fade) ease}
body[data-locked="1"][data-state="recording"] .lockdot{opacity:1}

/* ---- Bulle de consigne (mains libres, attente longue) ---- */
.hint{position:absolute;left:50%;bottom:56px;transform:translate(-50%,4px);max-width:320px;
  padding:6px 12px;border-radius:999px;background:var(--surface);
  box-shadow:inset 0 0 0 .5px var(--edge),var(--shadow);
  font-size:12px;line-height:16px;font-weight:500;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;opacity:0;
  transition:opacity var(--t-fade) ease,transform var(--t-grow) var(--spring)}
body.hint-on .hint{opacity:1;transform:translate(-50%,0)}

/* ---- Carte compacte (trop court, erreur, micro, information) ---- */
.card{position:absolute;left:50%;bottom:14px;width:max-content;min-width:200px;max-width:320px;
  padding:11px 16px 12px;border-radius:16px;background:var(--surface);
  box-shadow:inset 0 0 0 .5px var(--edge),var(--shadow);
  transform:translateX(-50%) scale(.92);transform-origin:50% 100%;opacity:0;
  transition:opacity var(--t-fade) ease,transform var(--t-grow) var(--spring)}
body.card-on .card{opacity:1;transform:translateX(-50%) scale(1)}
.ctitle{display:flex;align-items:baseline;gap:8px;font-size:13.5px;line-height:18px;font-weight:600}
.ctitle::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);
  transform:translateY(-1px)}
body[data-state="error"] .ctitle::before{background:var(--alert)}
.ctitle span,.csub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.csub{margin:3px 0 0 15px;font-size:12.5px;line-height:17px;color:var(--ink-2)}
.csub:empty{display:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  :root{--t-grow:0ms;--t-fade:0ms}
  body[data-state="transcribing"] .dot{animation:none;opacity:.8}
}
</style>
</head>
<body data-state="idle">
  <div class="hint" id="hint" aria-hidden="true"></div>
  <div class="card" id="card" aria-hidden="true">
    <div class="ctitle"><span id="ctitle"></span></div>
    <div class="csub" id="csub"></div>
  </div>
  <div class="pill" aria-hidden="true">
    <span class="lockdot"></span>
    <div class="layer l-wave"><div class="wave" id="wave"></div></div>
    <div class="layer l-work"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="layer l-done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg><span id="done"></span></div>
  </div>
  <div class="sr" id="status" role="status"></div>

<script>
(function(){
  "use strict";
  var body = document.body;
  var hint = document.getElementById('hint');
  var ctitle = document.getElementById('ctitle'), csub = document.getElementById('csub');
  var done = document.getElementById('done'), status = document.getElementById('status');
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---- Textes (fr/en), langue poussée par overlay.py via ovLang() ----
  var OV = {
    fr:{ listen:'Écoute', work:'Transcription', wait:'Encore un instant…', inserted:'Texte inséré', copied:'Texte copié',
         tooshort:'C’est un peu court.', tooshort_sub:'Maintiens le raccourci un peu plus longtemps.',
         error:'Une erreur est survenue.', retry_hk:'Réessaie : maintiens {0}', retry:'Réessaie quand tu veux.',
         mic:'Micro requis.', mic_sub:'Autorise le microphone dans Réglages.',
         locked:'Micro ouvert · {0} pour terminer', locked_nohk:'Micro ouvert · rappuie pour terminer',
         tap_sub:'Appuie deux fois pour garder le micro ouvert.' },
    en:{ listen:'Listening', work:'Transcribing', wait:'One more moment…', inserted:'Text inserted', copied:'Text copied',
         tooshort:'That was a bit short.', tooshort_sub:'Hold the shortcut a little longer.',
         error:'Something went wrong.', retry_hk:'Try again: hold {0}', retry:'Try again whenever you like.',
         mic:'Microphone needed.', mic_sub:'Allow the microphone in Settings.',
         locked:'Mic open · {0} to finish', locked_nohk:'Mic open · press again to finish',
         tap_sub:'Double-tap to keep the mic open.' }
  };
  var lang = 'fr', hotkey = null;
  function tt(k, a){
    var s = (OV[lang] || OV.fr)[k];
    if(s === undefined) s = OV.fr[k];
    if(s === undefined) return k;
    return a === undefined ? s : String(s).split('{0}').join(a);
  }

  // ---- Onde ----------------------------------------------------------------
  // Le niveau arrive à 10 Hz (ovLevel). La boucle d'images ne tourne QUE pendant
  // l'écoute : elle rapproche en douceur le niveau affiché du dernier niveau reçu
  // (filtre du premier ordre, indépendant de la cadence d'affichage), puis le
  // laisse retomber si plus rien n'arrive. Hors écoute, aucune image n'est
  // demandée : au repos l'overlay ne consomme rien.
  var N = 18, bars = [], env = [], phase = [];
  (function(){
    var w = document.getElementById('wave');
    for(var i = 0; i < N; i++){
      var b = document.createElement('span'); b.className = 'wb'; w.appendChild(b); bars.push(b);
      env.push(0.35 + 0.65 * Math.sin(Math.PI * (i + 0.5) / N));   // plus haut au centre
      phase.push((i * 1.7) % 6.283);
    }
  })();
  var target = 0, shown = 0, lastLevelAt = 0, lastFrameAt = 0, raf = 0;
  var TAU_MS = 90;          // temps de réponse du lissage
  var HOLD_MS = 250;        // sans nouveau niveau au-delà, la cible retombe
  var DECAY_MS = 180;       // vitesse de cette retombée

  function now(){ return window.performance ? performance.now() : Date.now(); }
  function paint(level, t){
    for(var i = 0; i < N; i++){
      // Vie propre à chaque barre, proportionnelle au niveau : calme en silence.
      var life = reduced ? 1 : 0.72 + 0.28 * Math.sin(phase[i] + t * 0.011);
      var s = 0.12 + 0.88 * env[i] * level * life;
      bars[i].style.transform = 'scaleY(' + s.toFixed(3) + ')';
    }
  }
  function frame(t){
    raf = 0;
    if(body.getAttribute('data-state') !== 'recording') return;
    var dt = lastFrameAt ? Math.min(100, t - lastFrameAt) : 16;
    lastFrameAt = t;
    if(t - lastLevelAt > HOLD_MS) target *= Math.exp(-dt / DECAY_MS);
    shown += (target - shown) * (1 - Math.exp(-dt / TAU_MS));
    paint(shown, t);
    raf = window.requestAnimationFrame(frame);
  }
  function startWave(){
    target = shown = 0; lastFrameAt = 0;
    paint(0, 0);
    if(!reduced && !raf) raf = window.requestAnimationFrame(frame);
  }
  function stopWave(){
    if(raf){ window.cancelAnimationFrame(raf); raf = 0; }
  }

  // ---- États ----------------------------------------------------------------
  var waitTimer = 0;
  function clearWait(){ if(waitTimer){ clearTimeout(waitTimer); waitTimer = 0; } }
  function setHint(text){
    hint.textContent = text || '';
    if(text) body.classList.add('hint-on'); else body.classList.remove('hint-on');
  }
  function setState(s){
    clearWait();
    body.setAttribute('data-state', s);
    if(s !== 'recording'){ stopWave(); body.removeAttribute('data-locked'); }
    body.classList.remove('card-on');
    setHint('');
  }
  function showCard(state, title, sub){
    setState(state);
    ctitle.textContent = title || '';
    csub.textContent = sub || '';
    body.classList.add('card-on');
    status.textContent = (title || '') + (sub ? ' ' + sub : '');
  }

  // ---- API pilotée par overlay.py (noms et signatures figés) ----------------
  window.ovLang = function(l){ if(l === 'fr' || l === 'en'){ lang = l; document.documentElement.setAttribute('lang', l); } };
  window.ovTheme = function(th){ document.documentElement.setAttribute('data-theme', th === 'light' ? 'light' : 'dark'); };
  window.ovHotkey = function(label){ hotkey = label || null; };

  window.ovRecording = function(){
    setState('recording');
    status.textContent = tt('listen');
    startWave();
  };
  window.ovLevel = function(v){
    v = parseFloat(v);
    if(isNaN(v)) return;
    target = Math.max(0, Math.min(1, v * 4.2));   // RMS de parole ~0,02 à 0,25 -> 0..1
    lastLevelAt = now();
    if(reduced && body.getAttribute('data-state') === 'recording') paint(target, 0);
  };
  window.ovLocked = function(label){
    body.setAttribute('data-locked', '1');
    setHint(label ? tt('locked', label) : tt('locked_nohk'));
  };
  window.ovTranscribing = function(rec_s){
    setState('transcribing');
    status.textContent = tt('work');
    // Rassure si c'est anormalement long (avant le chien de garde de app.py).
    waitTimer = setTimeout(function(){ waitTimer = 0; setHint(tt('wait')); }, 8000);
  };
  window.ovResult = function(trans_s, inserted, branch, text){
    setState('result');
    done.textContent = inserted ? tt('inserted') : tt('copied');
    status.textContent = done.textContent;
  };
  window.ovTooShort = function(){ showCard('tooshort', tt('tooshort'), tt('tooshort_sub')); };
  window.ovTooShortTap = function(){ showCard('tooshort', tt('tooshort'), tt('tap_sub')); };
  window.ovError = function(msg){
    showCard('error', msg || tt('error'), hotkey ? tt('retry_hk', hotkey) : tt('retry'));
  };
  window.ovMicNeeded = function(){ showCard('mic', tt('mic'), tt('mic_sub')); };
  window.ovInfo = function(title, sub){ showCard('info', title, sub); };
  // Fin d'affichage : la pilule se replie au repos (c'est l'animation de sortie).
  window.ovFadeOut = function(){ setState('idle'); };
  window.ovReset = function(){ setState('idle'); status.textContent = ''; };
})();
</script>
</body>
</html>
